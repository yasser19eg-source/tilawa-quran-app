name: Build Android Release & Debug

"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper and Debug Keystore
        run: |
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          chmod +x gradlew
          if [ ! -f ./debug.keystore ]; then
            keytool -genkeypair -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Tilawa App,OU=Mobile,O=Tilawa,L=Minya,S=Minya,C=EG"
          fi

      - name: Run Unit & UI Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Tilawa-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Check Release Signing Secrets
        id: check_secrets
        env:
          HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD != '' }}
          HAS_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ] && [ "$HAS_STORE_PASS" = "true" ] && [ "$HAS_KEY_PASS" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode Release Keystore Securely
        if: steps.check_secrets.outputs.ready == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "${{ runner.temp }}/my-upload-key.jks"
          test -s "${{ runner.temp }}/my-upload-key.jks"
          keytool -list -keystore "${{ runner.temp }}/my-upload-key.jks" -storepass "$STORE_PASSWORD" -alias upload >/dev/null

      - name: Build Signed Release APK & AAB
        if: steps.check_secrets.outputs.ready == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Clean Up Temporary Keystore File
        if: always()
        run: rm -f "${{ runner.temp }}/my-upload-key.jks"

      - name: Upload Signed Release APK
        if: steps.check_secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Tilawa-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Signed Release AAB
        if: steps.check_secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Tilawa-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
